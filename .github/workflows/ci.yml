name: Public worker checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-worker-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the public worker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run tests
        run: python -m pytest -q -W error

      - name: Validate shell entrypoints
        run: |
          bash -n scripts/run-profile-audit-worker.sh
          bash -n scripts/deploy-production.sh
          bash -n scripts/install-gpu-model.sh
