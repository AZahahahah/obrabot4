[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "obrabot4"
version = "0.1.0"
description = "Bounded GitHub-hosted OpenAI transport"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
